services:
  adameds-admisi:
    build:
      context: ./
      dockerfile: Dockerfile
      no_cache: true
    container_name: admisi-service
    image: admisi-service:dev
    environment:
      DOTENV_KEY: ${DOTENV_KEY}
      SYNC_DB: ${SYNC_DB}
    volumes:
      - type: bind
        source: /home/admin/adameds/.env.vault
        target: /adameds-admisi/.env.vault
    networks:
      - admisi
    ports:
      - 8083:8083
networks:
  admisi:
    driver: bridge
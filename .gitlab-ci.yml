stages:
  - build
  - deploy

build-image:
  stage: build
  before_script:
    - docker compose --env-file /home/admin/adameds/.env-admisi down --rmi all
  script:
    - docker build -t admisi-service:dev ./ --no-cache
  only:
    - main

deploy-app:
  stage: deploy
  only:
    - main
  script:
    - docker compose up -d